<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioTreat 加药配方</title><link rel="stylesheet" href="/assets/app.css"></head>
<body><header><div class="brand">BioTreat 工艺联控</div><nav><a href="/process">工艺总控</a><a href="/aeration">曝气调节</a><a href="/sludge">污泥回流</a><a href="/alarms">异常处置</a><a aria-current="page" href="/dosing">加药配方</a></nav></header>
<main><div class="page-head"><div><h1>加药配方与投加建议</h1><div class="muted">按来源、流量、阶段和最近有效 COD 样本计算建议，操作员确认后才会下发加药命令</div></div><div class="status"><span class="dot"></span><span id="health">checking</span></div></div>
<div class="grid">
<section class="panel wide"><h2>配方当前版本</h2><table><thead><tr><th>配方</th><th>版本</th><th>来源</th><th>阶段</th><th>流量 m³/h</th><th>药剂</th><th>投加比</th><th>登记时间</th></tr></thead><tbody id="recipes"></tbody></table></section>
<section class="panel"><h2>登记配方版本</h2><form id="recipe"><label>配方代码<input name="code" value="carbon-north"></label><label>进水来源<input name="source" value="north-intake"></label><label>处理阶段<select name="stage"><option value="receiving">receiving</option><option value="equalizing">equalizing</option><option value="biological" selected>biological</option><option value="settling">settling</option><option value="qualified">qualified</option><option value="discharging">discharging</option></select></label><label>流量下限 m³/h<input name="min_flow" type="number" value="100" min="1"></label><label>流量上限 m³/h<input name="max_flow" type="number" value="2000" min="1"></label><label>药剂<input name="chemical" value="carbon"></label><label>投加比 kg/kg COD<input name="dose_ratio" type="number" step="0.01" value="0.8" min="0.01"></label><button>登记新版本</button></form></section>
<section class="panel"><h2>评估投加建议</h2><form id="evaluate"><label>处理线<select name="line"><option>line-1</option><option>line-2</option><option>line-3</option></select></label><button>计算建议</button></form><div class="muted">缺少可信 COD 样本时仅显示原因，不会下发命令</div></section>
<section class="panel wide"><h2>建议记录</h2><label>处理线<select id="recLine"><option>line-1</option><option>line-2</option><option>line-3</option></select></label><table><thead><tr><th>建议时间</th><th>药剂</th><th>速率 kg/h</th><th>COD mg/L</th><th>配方@版本</th><th>采样时间</th><th>状态</th><th></th></tr></thead><tbody id="recs"></tbody></table></section>
<section class="panel wide"><h2>最近操作</h2><pre id="output">等待操作</pre></section>
</div></main>
<script src="/assets/common.js"></script><script>
const fmt=t=>t?new Date(t).toLocaleString():'-';
async function loadRecipes(){const d=await request('/api/recipes');document.querySelector('#recipes').innerHTML=d.recipes.map(r=>`<tr><td>${r.code}</td><td>v${r.version}</td><td>${r.source}</td><td>${r.stage}</td><td>${r.min_flow}–${r.max_flow}</td><td>${r.chemical}</td><td>${r.dose_ratio}</td><td>${fmt(r.created_at)}</td></tr>`).join('')}
async function loadRecs(){const line=document.querySelector('#recLine').value;const d=await request(`/api/process-lines/${line}/dosing-recommendations`);document.querySelector('#recs').innerHTML=d.recommendations.map(r=>`<tr><td>${fmt(r.created_at)}</td><td>${r.chemical}</td><td>${r.rate.toFixed(2)}</td><td>${r.basis.cod_mg_l}</td><td>${r.recipe_code}@v${r.recipe_version}</td><td>${fmt(r.sampled_at)}</td><td>${r.status}</td><td>${r.status==='pending'?`<button data-id="${r.id}" data-act="confirm">确认下发</button><button data-id="${r.id}" data-act="reject">驳回</button>`:''}</td></tr>`).join('');document.querySelectorAll('#recs [data-id]').forEach(b=>b.onclick=async()=>{try{show(await request(`/api/dosing-recommendations/${b.dataset.id}/${b.dataset.act}`,{method:'POST',body:'{}'}));loadRecs()}catch(err){showError(err)}})}
document.querySelector('#recipe').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{show(await request('/api/recipes',{method:'POST',body:JSON.stringify({code:f.get('code'),source:f.get('source'),stage:f.get('stage'),min_flow:Number(f.get('min_flow')),max_flow:Number(f.get('max_flow')),chemical:f.get('chemical'),dose_ratio:Number(f.get('dose_ratio'))})}));loadRecipes()}catch(err){showError(err)}});
document.querySelector('#evaluate').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{const d=await request(`/api/process-lines/${f.get('line')}/dosing-recommendations`,{method:'POST',body:'{}'});show(d.ok?d.recommendation:{'未生成建议':d.reason});loadRecs()}catch(err){showError(err)}});
document.querySelector('#recLine').addEventListener('change',()=>loadRecs().catch(showError));
loadRecipes().catch(showError);loadRecs().catch(showError);
</script></body></html>
